name: build-linux

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate bundle
        run: go run ./src/genembed

      - name: Test
        run: go test ./...

      - name: Build
        env:
          # CI artifacts are unreleased code: never stamp them with a real
          # release tag (that would also make `paper update` wrongly report
          # "already up to date" when run from one).
          PAPER_CLI_VERSION: dev
        run: sh scripts/build.sh

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-linux
          path: build/paper
          if-no-files-found: error

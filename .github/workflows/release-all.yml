name: release-all

# Manual only: run from the Actions tab ("Run workflow").
# Builds paper for macOS, Windows and Linux, then publishes one
# GitHub Release containing all three binaries.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to release (e.g. v1.2.3). Leave empty to auto-bump.'
        required: false
        default: ''
      bump:
        description: 'Which part to bump when version is empty'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, needed to compute the next version

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "error: version must look like v1.2.3, got '$TAG'" >&2
              exit 1
            fi
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "error: tag '$TAG' already exists" >&2
              exit 1
            fi
          else
            LATEST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1 || true)
            if [ -z "$LATEST" ]; then
              echo "no version tags found, starting from v0.0.0"
              LATEST="v0.0.0"
            fi
            echo "latest tag: $LATEST"
            VER="${LATEST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$VER"
            case "$INPUT_BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *) PATCH=$((PATCH + 1)) ;;
            esac
            TAG="v$MAJOR.$MINOR.$PATCH"
            while git rev-parse "$TAG" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
              TAG="v$MAJOR.$MINOR.$PATCH"
            done
          fi
          echo "releasing: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: paper-macos
            asset: paper-macos
            src: build/paper
            build: sh scripts/build.sh
          - os: windows-latest
            artifact: paper-windows
            asset: paper-windows.exe
            src: build/paper.exe
            build: powershell -ExecutionPolicy Bypass -File scripts/build.ps1
          - os: ubuntu-latest
            artifact: paper-linux
            asset: paper-linux
            src: build/paper
            build: sh scripts/build.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate bundle
        run: go run ./src/genembed

      - name: Test
        run: go test ./...

      - name: Build
        env:
          PAPER_CLI_VERSION: ${{ needs.version.outputs.tag }}
        run: ${{ matrix.build }}

      - name: Verify clean tree
        shell: bash
        run: |
          # The committed bundle constants must reproduce byte-identically
          # from a fresh checkout (line endings, untracked dirs, Go version
          # drift can all silently change them). Never ship a "-dirty"
          # release: fail loudly instead so it gets fixed first.
          if [ -n "$(git status --porcelain)" ]; then
            echo "error: working tree is dirty after build (regenerate + commit first):" >&2
            git status --porcelain >&2
            exit 1
          fi

      - name: Rename binary
        shell: bash
        run: mv "${{ matrix.src }}" "build/${{ matrix.asset }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so release notes can be generated

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ needs.version.outputs.tag }}'
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes \
            dist/paper-macos/paper-macos \
            dist/paper-windows/paper-windows.exe \
            dist/paper-linux/paper-linux
